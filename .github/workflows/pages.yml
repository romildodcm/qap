name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem do toolchain
        uses: docker/build-push-action@v6
        with:
          context: firmware
          file: firmware/Dockerfile
          push: false
          load: true
          tags: uvk5-build

      - name: Compilar firmware (make clean && make)
        run: |
          docker run --rm -v "$PWD/firmware:/app" -w /app uvk5-build /bin/sh -c "make clean && make"

      - name: Verificar binário e hash
        run: |
          ls -la firmware/build/firmware.packed.bin
          shasum -a 256 firmware/build/firmware.packed.bin

      - name: Copiar binário para a pasta web/downloads
        run: |
          mkdir -p web/downloads
          cp firmware/build/firmware.packed.bin web/downloads/firmware.packed.bin
          ls -la web/downloads/

      - name: Upload artifact (site web/)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web
          if-no-files-found: error

  deploy:
    needs: build-firmware
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact (site web/)
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

